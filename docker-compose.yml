services:
  canvas-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canvas-tracker
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONFIG_PATH=/app/config/students.yaml
      - SECRETS_PATH=/app/secrets/google-service-account.json
      - DATA_DIR=/app/data
      - RUN_SCHEDULE=${RUN_SCHEDULE:-06:00}
      - GOOGLE_SPREADSHEET_ID_OR_NAME=${GOOGLE_SPREADSHEET_ID_OR_NAME:-Canvas_Student_Assignments}
      - MQTT_HOST=${MQTT_HOST:-bigdata}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_DISCOVERY_PREFIX=${MQTT_DISCOVERY_PREFIX:-homeassistant}
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
      - ./data:/app/data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import canvas_tracker; print('healthy')"]
      interval: 5m
      timeout: 15s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
