[project]
name = "canvas-tracker"
version = "0.2.0"
description = "Automated Canvas LMS & Follett Aspen SIS reconciler with Google Sheets Gantt and Home Assistant MQTT integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "google-auth>=2.35.0",
    "gspread>=6.1.4",
    "openai>=1.55.0",
    "paho-mqtt>=2.1.0",
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_tracker"]